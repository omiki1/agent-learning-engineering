<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Research Agent</title>
<style>body{font:16px system-ui;max-width:760px;margin:48px auto;padding:0 20px}textarea,button{font:inherit}textarea{width:100%;height:90px}button{margin:12px 0;padding:8px 16px}pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:8px}</style></head>
<body><h1>离线 Research Agent</h1><textarea id="q">什么时候应该使用 Multi-Agent？</textarea><br><button id="run">研究</button><pre id="out">等待输入</pre>
<script>document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#out');out.textContent='运行中…';const response=await fetch('/research',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:document.querySelector('#q').value})});out.textContent=JSON.stringify(await response.json(),null,2)}</script></body></html>
